# The gate. Nothing merges that does not typecheck, pass its tests, and build.
#
# STEP ORDER IS LOAD-BEARING: `ingest` runs BEFORE `typecheck`.
#
# `src/data/` is git-ignored, but refresh.yml force-adds the generated Radar and
# Studies snapshots because page modules import them directly. Restoring the
# committed copies gives CI deterministic build inputs without touching the
# network.
#
# CI runs the ingest OFFLINE. A pull request must not depend on eight external
# APIs being up, and it must not put load on NCBI or a university calendar on
# every push. `--offline` rebuilds from the committed snapshot instead; the
# guard step below fails the run if that leaves nothing to build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Per-branch. Superseded pushes are worth cancelling; nothing here writes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore the committed snapshot
        run: |
          set -euo pipefail
          mkdir -p src/data
          for snapshot in radar.json digests.json studies.json studies-taxonomies.json studies-diff.json; do
            if ! git cat-file -e "HEAD:src/data/$snapshot" 2>/dev/null; then
              echo "::error::Missing committed src/data/$snapshot. Run refresh.yml first."
              exit 1
            fi
            git show "HEAD:src/data/$snapshot" > "src/data/$snapshot"
          done

      - name: Build data (offline)
        run: npm run ingest:offline

      # Offline Studies ingestion deliberately avoids taxonomy requests. Put
      # the committed taxonomy and diff artifacts back before building so CI
      # verifies the same labels and feed metadata that production will use.
      - name: Restore committed Studies artifacts after offline ingest
        run: |
          set -euo pipefail
          for snapshot in studies.json studies-taxonomies.json studies-diff.json; do
            git show "HEAD:src/data/$snapshot" > "src/data/$snapshot"
          done

      - name: Require build data
        run: |
          for snapshot in radar.json digests.json studies.json studies-taxonomies.json studies-diff.json; do
            [ -s "src/data/$snapshot" ] || { echo "::error::Missing or empty src/data/$snapshot."; exit 1; }
          done
          node -e '
            const fs = require("fs");
            const snap = JSON.parse(fs.readFileSync("src/data/radar.json", "utf8"));
            const studies = JSON.parse(fs.readFileSync("src/data/studies.json", "utf8"));
            const r = snap.research?.items?.length ?? 0;
            const c = snap.campus?.items?.length ?? 0;
            const s = studies.studies?.length ?? 0;
            if (r + c === 0) { console.error("::error::snapshot has zero items; nothing to build against."); process.exit(1); }
            if (s === 0) { console.error("::error::Studies snapshot has zero items; nothing to build against."); process.exit(1); }
            console.log(`radar.json: ${r} papers, ${c} campus items; studies.json: ${s} studies`);
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        # `astro build`, not `npm run build`: the data is already in place, and
        # `npm run build` would re-run a live ingest.
        run: npx astro build

      - name: No contact addresses in the published output
        # THE PROMISE THAT MATTERS MOST HERE.
        #
        # calendar.tamu.edu publishes `registration_owner_email` - a real staff
        # address - on well over half its events, and the study registry
        # publishes a coordinator address on nearly every listing. This site
        # deploys publicly, so a regression that lets one through republishes
        # staff addresses as scrapeable plaintext. Three defences exist: the
        # connectors never read those fields, `stripEmails` scrubs free text,
        # and this asserts on the artifact that actually ships.
        run: |
          set -uo pipefail
          hits=$(grep -rEoh --exclude-dir=.prerender \
            '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' dist || true)
          if [ -n "$hits" ]; then
            echo "::error::Email addresses are present in plaintext in dist/. See src/core/text.ts stripEmails and the connector headers."
            printf '%s\n' "$hits" | sort -u | sed 's/^/  leaked: /'
            exit 1
          fi
          echo "dist/ is clean: no plaintext email addresses."

      - name: Validate the artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.html dist/research/index.html dist/campus/index.html dist/campus/sources/index.html dist/studies/index.html; do
            [ -s "$f" ] || { echo "::error::missing or empty build output: $f"; exit 1; }
          done
          # Every asset and link must carry the /radar/ base. Serving these
          # anywhere else 404s, so a wrong prefix is a broken deploy.
          grep -Fq '"/radar/_astro/' dist/index.html
          grep -Fq 'href="/radar/research/"' dist/index.html
          grep -Fq 'href="/radar/studies/"' dist/index.html
          # The domain lives on the user site; a CNAME here would hijack it.
          test ! -e CNAME
          test ! -e dist/CNAME
