# The deploy. A push to main runs this and the result is https://harsh.bet/radar/.
#
# This is a GitHub Pages *project* site. The user site (harsh4873.github.io)
# carries the harsh.bet custom domain, so every project repo on the account is
# served at the path named after it - the repo name IS the route. No CNAME file
# belongs in this repo; the domain mapping lives entirely on the user site, and
# a stray CNAME here would try to claim the domain for this repo.
#
# Data freshness: this workflow deploys the COMMITTED snapshot rather than
# running a live ingest, for two reasons. A full ingest takes ~3 minutes and
# hits eight external APIs, so doing it on every code push would put avoidable
# load on NCBI and a university calendar for changes that have nothing to do
# with the data. And a deploy that depends on eight upstreams being healthy is
# a deploy that fails for reasons unrelated to the change. refresh.yml owns
# data freshness on a schedule and dispatches this workflow when it lands new
# data.

name: Deploy Radar to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        # Reads the Pages config. The site itself is enabled once, by hand:
        # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
        # A workflow token cannot create the Pages site (the create API needs
        # administration permissions Actions tokens never get), so there is
        # deliberately no `enablement` here - this step fails fast with
        # "Not Found" until that one-time setting exists.
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the committed snapshot
        run: |
          mkdir -p src/data
          git show HEAD:src/data/radar.json > src/data/radar.json 2>/dev/null || echo "no committed snapshot"
          git show HEAD:src/data/digests.json > src/data/digests.json 2>/dev/null || echo '[]' > src/data/digests.json

      - name: Require build data
        run: |
          if [ ! -f src/data/radar.json ]; then
            echo "::error::No committed snapshot. Run 'npm run ingest' locally and commit src/data/radar.json, or run refresh.yml first."
            exit 1
          fi
          node -e '
            const snap = JSON.parse(require("fs").readFileSync("src/data/radar.json", "utf8"));
            const n = (snap.research?.items?.length ?? 0) + (snap.campus?.items?.length ?? 0);
            if (n === 0) { console.error("::error::snapshot has zero items."); process.exit(1); }
            console.log(`building against ${n} items from ${snap.fetchedAt}`);
          '

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npx astro build

      - name: No contact addresses in the published output
        # See ci.yml for why this matters. This is the copy asserted on the
        # artifact that actually ships.
        run: |
          set -uo pipefail
          hits=$(grep -rEoh --exclude-dir=.prerender \
            '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' dist || true)
          if [ -n "$hits" ]; then
            echo "::error::Refusing to deploy: email addresses are in plaintext in dist/."
            printf '%s\n' "$hits" | sort -u | sed 's/^/  leaked: /'
            exit 1
          fi
          echo "dist/ is clean: no plaintext email addresses."

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.html dist/research/index.html dist/campus/index.html; do
            [ -s "$f" ] || { echo "::error::missing or empty build output: $f"; exit 1; }
          done
          grep -Fq '"/radar/_astro/' dist/index.html
          grep -Fq 'href="/radar/research/"' dist/index.html
          test ! -e CNAME
          test ! -e dist/CNAME
          # _astro/ starts with an underscore, which Jekyll would exclude.
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
